name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml pytest
      - name: Regression tests (141, hermetic)
        run: python -m pytest tests/ -q
      - name: Demo e2e (synthetic pipeline + assertions)
        run: python synthetic/demo.py
      - name: Leak scan (secrets + machine-path blacklist)
        run: python eval/leak_scan.py
